name: Build Derbis Windows Test

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Windows test release tag"
        required: true
        default: "desktop-v1.0.3-test.1"
      release_name:
        description: "Visible Windows release name"
        required: true
        default: "Derbis for Windows v1.0.3 Test 1"
      release_version:
        description: "Version used in installer and checksum file names"
        required: true
        default: "1.0.3-test.1"
      prerelease:
        description: "Publish this release as a prerelease"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  package:
    name: Package Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify desktop version metadata
        shell: pwsh
        run: |
          Get-Content version.properties
          if (-not (Select-String -Path version.properties -Pattern '^derbisDesktopVersion=1\.0\.3$')) {
            throw 'desktop/version.properties must declare derbisDesktopVersion=1.0.3'
          }

      - name: Run desktop tests
        shell: pwsh
        run: .\gradlew.bat test --no-daemon --stacktrace

      - name: Build MSI and EXE installers
        shell: pwsh
        run: .\gradlew.bat packageReleaseMsi packageReleaseExe --no-daemon --stacktrace

      - name: Stage versioned installers and checksums
        shell: pwsh
        run: |
          $version = '${{ inputs.release_version }}'
          $expectedTag = "desktop-v$version"
          if ('${{ inputs.release_tag }}' -ne $expectedTag) {
            throw "release_tag must be $expectedTag so installer versioning and release history stay aligned."
          }
          New-Item -ItemType Directory -Force -Path ..\build-assets | Out-Null
          $msi = Get-ChildItem app\build\compose\binaries\main-release\msi\*.msi | Select-Object -First 1
          $exe = Get-ChildItem app\build\compose\binaries\main-release\exe\*.exe | Select-Object -First 1
          if ($null -eq $msi -or $null -eq $exe) { throw 'Expected both MSI and EXE installers.' }
          $baseName = "DERBIS-Windows-$version-x64"
          $msiTarget = "..\build-assets\$baseName.msi"
          $exeTarget = "..\build-assets\$baseName.exe"
          Copy-Item $msi.FullName $msiTarget
          Copy-Item $exe.FullName $exeTarget
          $msiHash = (Get-FileHash $msiTarget -Algorithm SHA256).Hash.ToLowerInvariant()
          $exeHash = (Get-FileHash $exeTarget -Algorithm SHA256).Hash.ToLowerInvariant()
          "$msiHash  $baseName.msi" | Set-Content "$msiTarget.sha256" -NoNewline -Encoding ascii
          "$exeHash  $baseName.exe" | Set-Content "$exeTarget.sha256" -NoNewline -Encoding ascii

      - name: Upload Windows installers and checksums
        uses: actions/upload-artifact@v4
        with:
          name: Derbis-Windows-${{ inputs.release_version }}
          path: build-assets/*

      - name: Create or update Windows test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_name }}
          prerelease: ${{ inputs.prerelease }}
          body: |
            ## Derbis for Windows — test build
            - Native Windows **MSI** and **EXE** installers.
            - Derbis branding, icon, Start-menu shortcut, user-level installation, and `derbis://` link support.
            - Local library, search, queue, playback, lyrics, downloads, and desktop media-key support.

            This is a test build. Please report installation, startup, playback, link-handling, and update issues before a stable Windows release.
          files: |
            build-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
