name: Build Derbis Release APK

# Publishing stays manual until the required remote Jam endpoint and proprietary Discord SDK
# release secret are configured and device validation has passed.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Stable Android release tag"
        required: true
        default: "v1.1.0"
      release_name:
        description: "Visible release name"
        required: true
        default: "Derbis v1.1.0"
      release_version:
        description: "Version embedded in the Android package"
        required: true
        default: "1.1.0"
      release_version_code:
        description: "Monotonically increasing Android versionCode"
        required: true
        default: "3000202"

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate stable release metadata
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ inputs.release_tag }}'
          name='${{ inputs.release_name }}'
          version='${{ inputs.release_version }}'
          version_code='${{ inputs.release_version_code }}'
          [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "release_tag must be a stable v<major>.<minor>.<patch> tag"; exit 1; }
          [[ "${tag}" == "v${version}" ]] || { echo "release_tag must match release_version"; exit 1; }
          [[ "${name}" == "Derbis v${version}" ]] || { echo "release_name must match release_version"; exit 1; }
          [[ "${version_code}" =~ ^[1-9][0-9]*$ ]] || { echo "release_version_code must be a positive integer"; exit 1; }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Components
        shell: bash
        run: |
          set -euo pipefail
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Fetch optional authorized Discord Social SDK
        env:
          DISCORD_SOCIAL_SDK_URL: ${{ secrets.DISCORD_SOCIAL_SDK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${DISCORD_SOCIAL_SDK_URL}" ]]; then
            mkdir -p app/libs
            if curl --fail --location --retry 3 --output app/libs/discord_partner_sdk.aar "${DISCORD_SOCIAL_SDK_URL}" && unzip -tq app/libs/discord_partner_sdk.aar; then
              echo "Authorized Discord SDK supplied for this build."
            else
              rm -f app/libs/discord_partner_sdk.aar
              echo "Discord SDK could not be fetched or verified; continuing without Rich Presence."
            fi
          else
            echo "Discord SDK URL is not configured; this release APK will leave Discord Rich Presence unavailable."
          fi

      - name: Report optional remote Jam relay configuration
        env:
          DERBIS_JAM_RELAY_URL: ${{ vars.DERBIS_JAM_RELAY_URL }}
        shell: bash
        run: |
          if [[ "${DERBIS_JAM_RELAY_URL}" =~ ^wss://.+/jam$ ]]; then
            echo "Using configured Derbis Jam relay."
          else
            echo "No Derbis Jam relay configured; the release APK will safely use Derbis Jam — LAN."
          fi

      - name: Build Derbis Sidecar Release APK
        # These optional release secrets enable only the owner-operated Canvas Catalog.
        # Do not echo their values: the key is a distribution credential, not a user setting.
        env:
          DERBIS_VERSION_NAME: ${{ inputs.release_version }}
          DERBIS_VERSION_CODE: ${{ inputs.release_version_code }}
          DERBIS_JAM_RELAY_URL: ${{ vars.DERBIS_JAM_RELAY_URL }}
          DERBIS_CANVAS_CATALOG_URL: ${{ secrets.DERBIS_CANVAS_CATALOG_URL }}
          DERBIS_CANVAS_CATALOG_KEY: ${{ secrets.DERBIS_CANVAS_CATALOG_KEY }}
        run: |
          ./gradlew :app:assembleSidecarRelease --no-daemon --stacktrace \
            -PderbisVersionName="${DERBIS_VERSION_NAME}" \
            -PderbisVersionCode="${DERBIS_VERSION_CODE}"

      - name: Verify Sidecar Release APK identity
        env:
          DERBIS_VERSION_NAME: ${{ inputs.release_version }}
          DERBIS_VERSION_CODE: ${{ inputs.release_version_code }}
        shell: bash
        run: |
          set -euo pipefail
          apk='app/build/outputs/apk/sidecarRelease/app-sidecarRelease.apk'
          [[ -s "${apk}" ]] || { echo "Release APK was not produced"; exit 1; }
          badging="$("${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging "${apk}")"
          printf '%s\n' "${badging}"
          expected="package: name='com.derbis.app' versionCode='${DERBIS_VERSION_CODE}' versionName='${DERBIS_VERSION_NAME}'"
          grep -F -- "${expected}" <<< "${badging}" >/dev/null || {
            echo "Built APK identity does not match the requested stable release metadata" >&2
            exit 1
          }

      - name: Stage Sidecar Release APK
        run: |
          mkdir -p build-assets
          cp app/build/outputs/apk/sidecarRelease/app-sidecarRelease.apk build-assets/Derbis.apk

      - name: Upload Derbis APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Derbis-Release-APK
          path: build-assets/Derbis.apk

      - name: Create / Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_name }}
          draft: false
          prerelease: false
          body: |
            ## What's Fixed
            - `d64bbb7` Selecting a previously played track now starts it from the beginning.
            - `84b2677` Crossfade ignores stale handoff completions, preventing an older transition from replacing the active deck.
            - `9e9300c` Apple Music 13 lyrics keep a dimmed artwork backdrop so white lyric text remains readable.

            ## What's New
            - `e871551` Opt-in animated artwork Canvas support is available again; static artwork remains the default.
            - `4f9640e` Liquid Glass now reaches Search, Explore, Library, Settings, the mini-player, and navigation.
            - `5f26471` AI Slop adds a persisted setting that filters explicitly identified AI-generated music and video content.
            - `ba79e80` Derbis Jam invite codes now use letters only and are at least six letters long.
            - `7e0be74` Jam hosts can explicitly choose LAN Jam for the same Wi-Fi network or Server Jam through the configured Derbis relay.
            - `c9095f7` Signed-in Spotify users can list their Spotify library, view accessible tracks, and import them through Derbis matching.
            - `e3d9cb3` Data Saver suppresses background prefetching, Canvas fetching, and mobile-data automatic downloads while retaining listener-started playback, search, and imports.

            ## Changed
            - `deaaf7c` Player artwork is static by default.
            - `f6132c0` Apple Music 13 uses full-bleed artwork while Velvet uses the contained cover treatment.
            - `fb07fc9` Explore Samples has been removed.
            - `f5c6583` The two-song Derbis Mix tool has been removed; Mix Studio and automatic mixing remain.
            - `3439bf4` Full-player tap, long-press, double-tap, and vertical-swipe gestures have been removed.
            - `9953af2` Internal Levyra identifiers have been renamed to Derbis.
          files: build-assets/Derbis.apk
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
