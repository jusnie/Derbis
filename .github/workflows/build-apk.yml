name: Build Derbis Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Components
        shell: bash
        run: |
          set -euo pipefail
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Derbis Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Stage Release APK
        run: |
          mkdir -p build-assets
          find app/build/outputs/apk/release/ -type f -name "*.apk" -exec cp {} build-assets/Derbis-Release.apk \;

      - name: Upload Derbis Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Derbis-Release-APK
          path: build-assets/*.apk

      - name: Create / Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: "Derbis v1.0.1"
          draft: false
          prerelease: false
          body: |
            ## Derbis v1.0.1 Release
            - ⚡ **Lightweight & High Performance**: Completely removed Chucker HTTP monitoring and enabled full R8 minification & resource shrinking.
            - 🚀 **Lag & ANR Fix**: Zero background network inspection, smooth 120Hz scrolling, fast startup.
            - 🖤 **AMOLED Pitch Black & Crisp White**: Optimized for battery and OLED displays (#000000).
            - 🌅 **Dynamic Greetings**: Morning, afternoon, evening, and night greetings.
            - 🔗 **Updated Sources**: GitHub repo and update checks pointed directly to `jusnie/Derbis`.
            - 🏷️ **Clean Branding**: Attributed to Yasuda, all legacy author names and links updated.
          files: build-assets/Derbis-Release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
