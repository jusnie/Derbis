name: Build Derbis Release APK

# Publishing stays manual until the required remote Jam endpoint and proprietary Discord SDK
# release secret are configured and device validation has passed.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Stable Android release tag"
        required: true
        default: "v1.5.0"
      release_name:
        description: "Visible release name"
        required: true
        default: "Derbis v1.5.0"
      release_version:
        description: "Version embedded in the Android package"
        required: true
        default: "1.5.0"
      release_version_code:
        description: "Monotonically increasing Android versionCode"
        required: true
        # 1.5.0 has to outrank the 1.5.0 test build (3000212) and the 1.6.0 prebuild (3000211) so
        # Android installs it over either of them instead of refusing it as a downgrade.
        default: "3000213"

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate stable release metadata
        shell: bash
        env:
          # A dispatch normally supplies all four. The fallbacks are the release they were last
          # set from, so an empty dispatch still cuts a valid tag instead of an empty one.
          RELEASE_TAG: ${{ inputs.release_tag || 'v1.5.0' }}
          RELEASE_NAME: ${{ inputs.release_name || 'Derbis v1.5.0' }}
          RELEASE_VERSION: ${{ inputs.release_version || '1.5.0' }}
          RELEASE_VERSION_CODE: ${{ inputs.release_version_code || '3000213' }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          name="${RELEASE_NAME}"
          version="${RELEASE_VERSION}"
          version_code="${RELEASE_VERSION_CODE}"
          [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "release_tag must be a stable v<major>.<minor>.<patch> tag"; exit 1; }
          [[ "${tag}" == "v${version}" ]] || { echo "release_tag must match release_version"; exit 1; }
          [[ "${name}" == "Derbis v${version}" ]] || { echo "release_name must match release_version"; exit 1; }
          [[ "${version_code}" =~ ^[1-9][0-9]*$ ]] || { echo "release_version_code must be a positive integer"; exit 1; }
          # The release page is the notes file, so a release cannot be cut with a placeholder body.
          notes="docs/releases/${tag}.md"
          [[ -s "${notes}" ]] || { echo "release notes file ${notes} is missing or empty"; exit 1; }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Components
        shell: bash
        run: |
          set -euo pipefail
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Fetch optional authorized Discord Social SDK
        env:
          DISCORD_SOCIAL_SDK_URL: ${{ secrets.DISCORD_SOCIAL_SDK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${DISCORD_SOCIAL_SDK_URL}" ]]; then
            mkdir -p app/libs
            if curl --fail --location --retry 3 --output app/libs/discord_partner_sdk.aar "${DISCORD_SOCIAL_SDK_URL}" && unzip -tq app/libs/discord_partner_sdk.aar; then
              echo "Authorized Discord SDK supplied for this build."
            else
              rm -f app/libs/discord_partner_sdk.aar
              echo "Discord SDK could not be fetched or verified; continuing without Rich Presence."
            fi
          else
            echo "Discord SDK URL is not configured; this release APK will leave Discord Rich Presence unavailable."
          fi

      - name: Report optional remote Jam relay configuration
        env:
          DERBIS_JAM_RELAY_URL: ${{ vars.DERBIS_JAM_RELAY_URL }}
        shell: bash
        run: |
          if [[ "${DERBIS_JAM_RELAY_URL}" =~ ^wss://.+/jam$ ]]; then
            echo "Using configured Derbis Jam relay."
          else
            echo "No Derbis Jam relay configured; the release APK will safely use Derbis Jam — LAN."
          fi

      - name: Build Derbis Sidecar Release APK
        # These optional release secrets enable only the owner-operated Canvas Catalog.
        # Do not echo their values: the key is a distribution credential, not a user setting.
        env:
          DERBIS_VERSION_NAME: ${{ inputs.release_version || '1.5.0' }}
          DERBIS_VERSION_CODE: ${{ inputs.release_version_code || '3000213' }}
          DERBIS_JAM_RELAY_URL: ${{ vars.DERBIS_JAM_RELAY_URL }}
          DERBIS_CANVAS_CATALOG_URL: ${{ secrets.DERBIS_CANVAS_CATALOG_URL }}
          DERBIS_CANVAS_CATALOG_KEY: ${{ secrets.DERBIS_CANVAS_CATALOG_KEY }}
          # Read directly by envOrProperty in app/build.gradle.kts; empty falls back to the id
          # baked into the build, so an unset secret cannot break Discord sign-in.
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
        shell: bash
        run: |
          set +e
          ./gradlew :app:assembleSidecarRelease --no-daemon --stacktrace --console=plain \
            -PderbisVersionName="${DERBIS_VERSION_NAME}" \
            -PderbisVersionCode="${DERBIS_VERSION_CODE}" 2>&1 | tee build.log
          status="${PIPESTATUS[0]}"
          set -e
          if [[ "${status}" -ne 0 ]]; then
            grep -E '^e: |error:|What went wrong|FAILURE:' build.log | tail -n 60 | while IFS= read -r line; do
              printf '::error::%s\n' "${line}"
            done
            exit "${status}"
          fi

      - name: Verify Sidecar Release APK identity
        env:
          DERBIS_VERSION_NAME: ${{ inputs.release_version || '1.5.0' }}
          DERBIS_VERSION_CODE: ${{ inputs.release_version_code || '3000213' }}
        shell: bash
        run: |
          set -euo pipefail
          apk='app/build/outputs/apk/sidecarRelease/app-sidecarRelease.apk'
          [[ -s "${apk}" ]] || { echo "Release APK was not produced"; exit 1; }
          badging="$("${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging "${apk}")"
          printf '%s\n' "${badging}"
          expected="package: name='com.derbis.app' versionCode='${DERBIS_VERSION_CODE}' versionName='${DERBIS_VERSION_NAME}'"
          grep -F -- "${expected}" <<< "${badging}" >/dev/null || {
            echo "Built APK identity does not match the requested stable release metadata" >&2
            exit 1
          }

      - name: Stage Sidecar Release APK
        run: |
          mkdir -p build-assets
          cp app/build/outputs/apk/sidecarRelease/app-sidecarRelease.apk build-assets/Derbis.apk
          cd build-assets
          sha256sum Derbis.apk | tee Derbis.apk.sha256

      - name: Upload Derbis APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Derbis-Release-APK
          path: |
            build-assets/Derbis.apk
            build-assets/Derbis.apk.sha256

      - name: Create / Update GitHub Release
        # Manual dispatch only, and the tag is cut at the commit that was dispatched. Publishing is
        # allowed from any branch because the metadata is validated above and the tag itself records
        # the commit the APK came from.
        if: github.ref_type == 'branch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || 'v1.5.0' }}
          name: ${{ inputs.release_name || 'Derbis v1.5.0' }}
          # Cut the tag at the commit this run built. Without it the tag is created at the default
          # branch's head, which is not necessarily the code in the APK.
          target_commitish: ${{ github.sha }}
          # docs/releases/v<version>.md is checked in, so the release page and the changelog cannot
          # drift apart and no placeholder body has to live in this workflow.
          body_path: docs/releases/${{ inputs.release_tag || 'v1.5.0' }}.md
          draft: false
          prerelease: false
          make_latest: true
          files: |
            build-assets/Derbis.apk
            build-assets/Derbis.apk.sha256
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
