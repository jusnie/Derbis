name: Build Derbis Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Components
        shell: bash
        run: |
          set -euo pipefail
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Derbis Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Stage Release APK
        run: |
          mkdir -p build-assets
          find app/build/outputs/apk/release/ -type f -name "*.apk" -exec cp {} build-assets/Derbis.apk \;

      - name: Upload Derbis APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Derbis-APK
          path: build-assets/Derbis.apk

      - name: Create / Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: "Derbis v1.0.3"
          draft: false
          prerelease: false
          body: |
            ## Derbis v1.0.3 Release
            - ◈ **New Derbis Logo**: Updated Android adaptive launcher icons, notification artwork, desktop PNG, and Windows icon.
            - 🎛️ **DJ Mix**: Crossfade / DJ transition control now supports 0–30 seconds; handoff logic prevents the occasional doubled-voice replay between tracks.
            - 🎬 **Animated Artwork**: Auto-selects the best available motion artwork, with Spotify Canvas, Apple Music, and TIDAL choices.
            - 🍎 **Apple Music Player Refresh**: Latest-style player presentation, audio badge, animated artwork stage, and synchronized lyric-line preview.
            - ⚡ **Lite Mode & High Refresh Rate**: Low-end optimization disables costly visuals; optional 90/120Hz display mode is available on supported devices.
            - ∞ **Endless Queue**: Continuous-radio queue capacity increased to 1,000 tracks with lazy scrolling.
            - 🧾 **Insights**: Derbis Wrapped and shareable Receiptify-style top-song cards are now fully Derbis-branded.
            - 🫧 **Liquid Glass**: Retained as a configurable player/interface design option.
          files: build-assets/Derbis.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
