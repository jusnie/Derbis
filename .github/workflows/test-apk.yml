name: Derbis Prebuild APK

# Test-only build. Ships the same applicationId and app label as the official
# build (com.derbis.app), is published as a GitHub pre-release, and never moves
# the "latest" pointer. Use the Release APK workflow for real releases.

# Manual only, and publishing is opt-in per run: with publish=false the APK is only a workflow
# artifact, so a build can be tried without a tag appearing anywhere.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the APK as a GitHub pre-release (test channel)"
        type: boolean
        default: false
  # TEMPORARY, remove once this file is on main: workflow_dispatch only fires for a
  # workflow that already exists on the default branch, and a dispatch against a
  # branch-only file finds nothing to run. A push-scoped trigger is the only way to
  # build this from a branch.
  push:
    branches:
      - arena/b05b2e2f-derbis

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: derbis-prebuild-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test builds report the requested version name, but keep a version code above the
  # previous prebuild so the APK installs over it instead of failing as a downgrade.
  #
  # Official v1.8.0 ships at 3000215, so unofficial test builds target higher still (3000216)
  # to keep installing straight over a released app. The verify step below reads this same
  # value, so the package identity the release is allowed to carry stays consistent.
  # The version name carries a prebuild qualifier above 1.8.0 so the in-app updater (which
  # compares semver, not versionCode) offers the test build to installations on the test track.
  DERBIS_VERSION_NAME: "1.8.1-prebuild.1"
  DERBIS_VERSION_CODE: "3000216"

jobs:
  prebuild-apk:
    name: Build Prebuild APK
    # Opt-in, like publishing. Every push to this branch used to compile a full APK, which meant
    # a commit that only changed a colour cost fourteen minutes of runner time and left a stale
    # artifact behind. A commit message containing [apk] is how a push asks for one; a dispatch
    # always builds.
    # The marker has to open the commit message, not merely appear in it: a commit that *discusses*
    # the marker must not look like it is asking for one, which is exactly what happened the first
    # time this was written with `contains`.
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '[apk]') || startsWith(github.event.head_commit.message, '[publish]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-37.0" "build-tools;36.0.0" \
            "ndk;28.2.13676358" "cmake;3.22.1"
          chmod +x gradlew

      - name: Build prebuild APK
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_SOCIAL_SDK_URL: ${{ secrets.DISCORD_SOCIAL_SDK_URL }}
          # Gradle reads this env var directly (see envOrProperty in app/build.gradle.kts) and
          # falls back to the id baked into the build when the secret is empty.
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          DERBIS_CANVAS_CATALOG_URL: ${{ secrets.DERBIS_CANVAS_CATALOG_URL }}
          DERBIS_CANVAS_CATALOG_KEY: ${{ secrets.DERBIS_CANVAS_CATALOG_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${DISCORD_SOCIAL_SDK_URL:-}" ]]; then
            mkdir -p app/libs
            if curl --fail --location --retry 3 --output app/libs/discord_partner_sdk.aar "${DISCORD_SOCIAL_SDK_URL}" && unzip -tq app/libs/discord_partner_sdk.aar; then
              echo "Authorized Discord SDK supplied."
            else
              rm -f app/libs/discord_partner_sdk.aar
              echo "Discord SDK unavailable; building without Rich Presence."
            fi
          else
            echo "No Discord SDK configured; Rich Presence stays unavailable."
          fi
          set +e
          ./gradlew :app:assembleSidecarRelease --no-daemon --stacktrace --console=plain \
            -PderbisVersionName="${DERBIS_VERSION_NAME}" \
            -PderbisVersionCode="${DERBIS_VERSION_CODE}" \
            -PderbisUpdateTrack=test 2>&1 | tee build.log
          status="${PIPESTATUS[0]}"
          set -e
          if [[ "${status}" -ne 0 ]]; then
            {
              echo 'Prebuild APK build failed.'
              echo '```'
              grep -E '^e: ' build.log | head -n 40
              echo '...'
              tail -n 15 build.log
              echo '```'
            } > /tmp/failure.md
            gh pr comment 2 --body-file /tmp/failure.md || true
            grep -E "^e: |FAILURE:|error:|What went wrong" build.log | tail -n 20 | while IFS= read -r line; do
              printf '::error::%s\n' "${line}"
            done
            # Diagnostic for runs whose failure leaves no '^e: ' lines (R8, dexing,
            # OOM, disk): surface the raw tail of the log as annotations too.
            tail -n 60 build.log | while IFS= read -r line; do
              line="${line//$'\n'/ }"
              [[ -n "${line// /}" ]] || continue
              printf '::error::%s\n' "$(printf '%s' "${line}" | cut -c1-400)"
            done
            exit "${status}"
          fi

      - name: Rename to derbis.apk and verify identity
        shell: bash
        run: |
          set -euo pipefail
          src='app/build/outputs/apk/sidecarRelease/app-sidecarRelease.apk'
          [[ -s "${src}" ]] || { echo "APK was not produced"; exit 1; }
          mkdir -p build_output
          cp "${src}" build_output/derbis.apk
          badging="$("${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging build_output/derbis.apk)"
          printf '%s\n' "${badging}" | head -3
          grep -F "package: name='com.derbis.app' versionCode='${DERBIS_VERSION_CODE}' versionName='${DERBIS_VERSION_NAME}'" <<< "${badging}" >/dev/null \
            || { echo "Package name, version code or version name changed; refusing to publish a test build."; exit 1; }
          ls -la build_output
          sha256sum build_output/derbis.apk | tee build_output/derbis.apk.sha256

      - name: Upload derbis.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: derbis-apk
          path: |
            build_output/derbis.apk
            build_output/derbis.apk.sha256
          if-no-files-found: error

  publish:
    # Off unless the run asked for it. A build that only exists to be tested does not need a
    # tag: the APK stays a workflow artifact, and nothing appears on the Releases page.
    #
    # Two ways to ask. A dispatch sets the input. A push cannot, because this workflow only runs
    # on push from a branch that is not the default one — so a commit message containing
    # [publish] is the push-triggered equivalent. Ordinary pushes publish nothing.
    if: ${{ needs.prebuild-apk.result == 'success' && (inputs.publish || startsWith(github.event.head_commit.message, '[publish]')) }}
    # A separate, short job on purpose. Every attempt to create the release at the end of the
    # 14 minute build job failed while the same request from a fresh job succeeds, so publishing
    # lives here: it only has to download the artifact and push it. If it does fail, re-running
    # this job alone is enough — it does not rebuild anything.
    name: Publish pre-release
    needs: prebuild-apk
    runs-on: ubuntu-latest
    steps:
      - name: Download derbis.apk
        uses: actions/download-artifact@v4
        with:
          name: derbis-apk
          path: build_output

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          tag="prebuild-${DERBIS_VERSION_NAME}-${GITHUB_SHA::7}"
          api="https://api.github.com/repos/jusnie/Derbis"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json")
          body="Test build from \`${GITHUB_SHA::7}\` on \`${GITHUB_REF_NAME}\`. Not an official release.

          - Package stays \`com.derbis.app\`, app name stays Derbis, version name reads ${DERBIS_VERSION_NAME}.
          - Signed with the CI debug key; unreleased and unsupported.
          - Verify the file with derbis.apk.sha256 before installing.

          #Derbis #Prebuild #Android #APK #TestBuild"
          log=publish.log
          : > "${log}"
          note() { echo "$1" | tr '\n' ' ' | cut -c1-300; }

          id=$(curl -sS "${auth[@]}" "${api}/releases/tags/${tag}" 2>>"${log}" | jq -r '.id // empty' 2>>"${log}" || true)
          if [[ -z "${id}" ]]; then
            payload=$(jq -n --arg tag "${tag}" --arg target "${GITHUB_SHA}" \
              --arg name "Derbis Prebuild ${DERBIS_VERSION_NAME} (test)" --arg body "${body}" \
              '{tag_name:$tag, target_commitish:$target, name:$name, body:$body, prerelease:true, draft:false}')
            for attempt in 1 2 3; do
              resp=$(curl -sS "${auth[@]}" -H "Content-Type: application/json" -X POST -d "${payload}" \
                -w '\n%{http_code}' "${api}/releases" 2>>"${log}" || true)
              code=$(printf '%s' "${resp}" | tail -n1)
              json=$(printf '%s' "${resp}" | sed '$d')
              id=$(printf '%s' "${json}" | jq -r '.id // empty' 2>>"${log}" || true)
              echo "create attempt ${attempt}: http=${code} body=$(note "${json}")" >> "${log}"
              [[ -n "${id}" ]] && break
              sleep 10
            done
          fi
          cat "${log}"
          if [[ -z "${id}" ]]; then
            echo "::error::Could not create pre-release ${tag}. $(note "$(tail -n 3 "${log}")")"
            exit 1
          fi
          echo "release id ${id}"

          ok=1
          for name in derbis.apk derbis.apk.sha256; do
            uploaded=0
            for attempt in 1 2 3; do
              resp=$(curl -sS "${auth[@]}" -H "Content-Type: application/octet-stream" -X POST \
                --data-binary "@build_output/${name}" -w '\n%{http_code}' \
                "https://uploads.github.com/repos/jusnie/Derbis/releases/${id}/assets?name=${name}" \
                2>>"${log}" || true)
              state=$(printf '%s' "${resp}" | sed '$d' | jq -r '.state // .message // "unknown"' 2>>"${log}" || true)
              if [[ "${state}" == "uploaded" ]]; then
                echo "${name} uploaded (attempt ${attempt})"
                uploaded=1
                break
              fi
              echo "${name} attempt ${attempt}: ${state}"
              sleep 15
            done
            [[ "${uploaded}" -eq 1 ]] || ok=0
          done
          if [[ "${ok}" -ne 1 ]]; then
            echo "::error::Could not upload the APK to ${tag}."
            exit 1
          fi
          echo "Published ${tag}"

  direct-link:
    # Publishes an already-built derbis-apk workflow artifact under an `apk-<sha>` pre-release tag.
    # Neither Stable (`^v\d+...` & prerelease=false) nor Test (`prebuild-*` or `^v\d+...`) matches
    # `apk-<sha>` in `updateTrackOf()`, so NO installed Derbis app ever detects it as an update,
    # while GitHub serves a direct `.apk` download URL without login or a `.zip` wrapper.
    needs: prebuild-apk
    if: ${{ always() && ((needs.prebuild-apk.result == 'success' && startsWith(github.event.head_commit.message, '[apk]')) || startsWith(github.event.head_commit.message, '[direct]')) }}
    name: Publish unlisted direct APK link
    runs-on: ubuntu-latest
    steps:
      - name: Resolve latest built APK run
        id: source_run
        env:
          GH_TOKEN: ${{ github.token }}
          PREBUILD_RESULT: ${{ needs.prebuild-apk.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${PREBUILD_RESULT}" == "success" ]]; then
            echo "run_id=${GITHUB_RUN_ID}" >> "${GITHUB_OUTPUT}"
            echo "short_sha=${GITHUB_SHA::7}" >> "${GITHUB_OUTPUT}"
            echo "full_sha=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
            echo "Using current workflow run ${GITHUB_RUN_ID} (${GITHUB_SHA::7})"
            exit 0
          fi
          api="https://api.github.com/repos/jusnie/Derbis"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json")
          runs_json="$(curl -fsSL "${auth[@]}" "${api}/actions/runs?branch=arena/b05b2e2f-derbis&status=success&per_page=20")"
          run_id=""
          run_sha=""
          while IFS=$'\t' read -r candidate_id candidate_sha; do
            [[ -n "${candidate_id}" ]] || continue
            art_count="$(curl -fsSL "${auth[@]}" "${api}/actions/runs/${candidate_id}/artifacts" | jq '[.artifacts[] | select(.name == "derbis-apk" and .expired == false)] | length')"
            if [[ "${art_count}" -gt 0 ]]; then
              run_id="${candidate_id}"
              run_sha="${candidate_sha}"
              break
            fi
          done < <(jq -r '.workflow_runs[] | "\(.id)\t\(.head_sha)"' <<< "${runs_json}")
          [[ -n "${run_id}" ]] || { echo "::error::No successful derbis-apk artifact run found on branch."; exit 1; }
          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${run_sha::7}" >> "${GITHUB_OUTPUT}"
          echo "full_sha=${run_sha}" >> "${GITHUB_OUTPUT}"
          echo "Resolved artifact from run ${run_id} (${run_sha::7})"

      - name: Download derbis-apk artifact
        uses: actions/download-artifact@v4
        with:
          name: derbis-apk
          run-id: ${{ steps.source_run.outputs.run_id }}
          github-token: ${{ github.token }}
          path: build_output

      - name: Upload direct APK asset under non-update tag
        env:
          GH_TOKEN: ${{ github.token }}
          SHORT_SHA: ${{ steps.source_run.outputs.short_sha }}
          FULL_SHA: ${{ steps.source_run.outputs.full_sha }}
        shell: bash
        run: |
          set -uo pipefail
          tag="apk-${SHORT_SHA}"
          api="https://api.github.com/repos/jusnie/Derbis"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json")
          body="Unofficial direct APK download built from \`${SHORT_SHA}\` on \`arena/b05b2e2f-derbis\`.

          - Tag \`${tag}\` is intentionally outside both \`v*\` (Stable) and \`prebuild-*\` (Test) update tracks so existing Derbis installs will never detect or prompt for it.
          - Package: \`com.derbis.app\` (${DERBIS_VERSION_NAME}, code ${DERBIS_VERSION_CODE})."
          log=direct_publish.log
          : > "${log}"

          id=$(curl -sS "${auth[@]}" "${api}/releases/tags/${tag}" 2>>"${log}" | jq -r '.id // empty' 2>>"${log}" || true)
          if [[ -z "${id}" ]]; then
            payload=$(jq -n --arg tag "${tag}" --arg target "${GITHUB_REF_NAME}" \
              --arg name "Derbis APK (${SHORT_SHA}, unlisted)" --arg body "${body}" \
              '{tag_name:$tag, target_commitish:$target, name:$name, body:$body, prerelease:true, draft:false}')
            for attempt in 1 2 3; do
              resp=$(curl -sS "${auth[@]}" -H "Content-Type: application/json" -X POST -d "${payload}" \
                -w '\n%{http_code}' "${api}/releases" 2>>"${log}" || true)
              json=$(printf '%s' "${resp}" | sed '$d')
              id=$(printf '%s' "${json}" | jq -r '.id // empty' 2>>"${log}" || true)
              [[ -n "${id}" ]] && break
              sleep 5
            done
          fi
          [[ -n "${id}" ]] || { cat "${log}"; echo "::error::Could not create tag ${tag}"; exit 1; }

          for item in "derbis.apk:application/vnd.android.package-archive" "derbis.apk.sha256:text/plain"; do
            name="${item%%:*}"
            ctype="${item#*:}"
            for attempt in 1 2 3; do
              resp=$(curl -sS "${auth[@]}" -H "Content-Type: ${ctype}" -X POST \
                --data-binary "@build_output/${name}" -w '\n%{http_code}' \
                "https://uploads.github.com/repos/jusnie/Derbis/releases/${id}/assets?name=${name}" \
                2>>"${log}" || true)
              state=$(printf '%s' "${resp}" | sed '$d' | jq -r '.state // .message // "unknown"' 2>>"${log}" || true)
              [[ "${state}" == "uploaded" ]] && break
              sleep 10
            done
          done
          echo "Direct URL: https://github.com/jusnie/Derbis/releases/download/${tag}/derbis.apk"
