name: Build Derbis iOS IPA (Sideloadly & AltStore Ready)

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Version embedded in the iOS package
        required: true
        default: "1.5.0"
      release_build_number:
        description: Monotonically increasing iOS build number
        required: true
        default: "3000210"
      publish_release:
        description: Attach the unsigned IPA to an explicitly requested GitHub release
        required: false
        default: "false"
  push:
    branches: [main]
    paths:
      - website/**
      - .github/workflows/build-ios-ipa.yml

permissions:
  contents: write

env:
  IOS_APP_VERSION: ${{ inputs.release_version || '1.5.0' }}
  IOS_BUILD_NUMBER: ${{ inputs.release_build_number || '3000210' }}

jobs:
  build-ios:
    name: Build unsigned iOS IPA from checked-in source
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Validate requested package metadata
        shell: bash
        run: |
          set -euo pipefail
          [[ "${IOS_APP_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "${IOS_BUILD_NUMBER}" =~ ^[1-9][0-9]*$ ]]

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build current web sources
        working-directory: website
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          npm run build
          test -s dist/index.html
          test -s dist/config.js
          test -d dist/assets
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("package.json"));if(p.version!==process.env.IOS_APP_VERSION)throw Error("Web/package version differs from IPA version")'

      - name: Create and sync the pinned Capacitor project
        working-directory: website
        run: |
          set -euo pipefail
          npx --no-install cap add ios
          npx --no-install cap sync ios

      - name: Configure iPhone 12+ package capabilities
        working-directory: website/ios/App/App
        shell: bash
        run: |
          set -euo pipefail
          python3 "${GITHUB_WORKSPACE}/scripts/configure_ios_ipa.py" \
            --plist Info.plist --version "${IOS_APP_VERSION}" --build-number "${IOS_BUILD_NUMBER}"

      - name: Compile the unsigned device app
        working-directory: website/ios/App
        run: |
          xcodebuild clean build \
            -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/derbis-ios-build" \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 ARCHS=arm64 \
            MARKETING_VERSION="${IOS_APP_VERSION}" CURRENT_PROJECT_VERSION="${IOS_BUILD_NUMBER}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Verify and package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/derbis-ios-build/Build/Products/Release-iphoneos/App.app"
          test -d "$app"
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")"
          build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")"
          [[ "$version" == "$IOS_APP_VERSION" && "$build" == "$IOS_BUILD_NUMBER" ]]
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          lipo -info "$app/$executable" | grep -F arm64
          test -s "$app/public/index.html"
          mkdir -p build_output/Payload
          cp -R "$app" build_output/Payload/Derbis.app
          (cd build_output && zip -qr9 "Derbis-${IOS_APP_VERSION}-unsigned.ipa" Payload)
          rm -rf build_output/Payload
          unzip -tq "build_output/Derbis-${IOS_APP_VERSION}-unsigned.ipa"
          echo 'Unsigned IPA produced. It must be signed before installation; no signing credentials were consumed.'

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Derbis-iOS-${{ env.IOS_APP_VERSION }}-unsigned
          path: build_output/*.ipa
          if-no-files-found: error

      - name: Attach to an explicitly requested release
        if: inputs.publish_release == 'true' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.IOS_APP_VERSION }}
          files: build_output/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
