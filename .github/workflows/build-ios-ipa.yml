name: Build Unofficial Derbis iOS IPA (Native SwiftUI · KSign Ready)

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Marketing version string embedded in Info.plist"
        required: true
        default: "1.8.0"
      release_build_number:
        description: "CFBundleVersion build integer"
        required: true
        default: "1"
      publish_prerelease:
        description: "Publish unofficial iOS pre-release tag (isolated from Android APK updater)"
        type: boolean
        default: true
  push:
    branches:
      - arena/b05b2e2f-derbis

permissions:
  contents: write

concurrency:
  group: derbis-ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build Native iOS IPA (KSign Ready)
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '[ios]') }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure XcodeGen is installed
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version
          xcodebuild -version

      - name: Generate Xcode project from ios/project.yml
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate

      - name: Set bundle version metadata
        working-directory: ios/Derbis
        env:
          IOS_VERSION: ${{ inputs.release_version || '1.8.0' }}
          IOS_BUILD: ${{ inputs.release_build_number || '1' }}
        shell: bash
        run: |
          set -euo pipefail
          plutil -replace CFBundleShortVersionString -string "${IOS_VERSION}" Info.plist
          plutil -replace CFBundleVersion -string "${IOS_BUILD}" Info.plist

      - name: Compile native arm64 iOS app bundle
        shell: bash
        run: |
          set +e
          xcodebuild clean build \
            -project ios/Derbis.xcodeproj \
            -scheme Derbis \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build_derived \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" 2>&1 | tee xcodebuild.log
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e
          if [[ "${BUILD_STATUS}" -ne 0 ]]; then
            grep -E "error:|fatal error:|Multiple commands produce" xcodebuild.log | head -n 25 | while IFS= read -r err_line; do
              echo "::error::${err_line}"
            done
            tail -n 15 xcodebuild.log | while IFS= read -r tail_line; do
              echo "::warning::${tail_line}"
            done
            exit "${BUILD_STATUS}"
          fi

      - name: Package KSign-compatible IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="build_derived/Build/Products/Release-iphoneos/Derbis.app"
          if [[ ! -d "${APP_PATH}" ]]; then
            echo "Compiled Derbis.app not found at ${APP_PATH}" >&2
            exit 1
          fi

          lipo -info "${APP_PATH}/Derbis"
          ls -la "${APP_PATH}"

          rm -rf build_output
          mkdir -p build_output/Payload
          cp -R "${APP_PATH}" build_output/Payload/Derbis.app

          if [[ ! -f build_output/Payload/Derbis.app/PkgInfo ]]; then
            printf 'APPL????' > build_output/Payload/Derbis.app/PkgInfo
          fi

          # Clean ad-hoc signature with zero restricted entitlements so KSign re-signs with any .p12/.mobileprovision
          codesign --force --deep --sign - --timestamp=none build_output/Payload/Derbis.app

          (
            cd build_output
            zip -qry9 Derbis-unofficial.ipa Payload
            shasum -a 256 Derbis-unofficial.ipa > Derbis-unofficial.ipa.sha256
          )
          rm -rf build_output/Payload
          ls -lh build_output/

      - name: Upload IPA workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Derbis-unofficial-iOS-IPA
          path: |
            build_output/Derbis-unofficial.ipa
            build_output/Derbis-unofficial.ipa.sha256

      - name: Publish unofficial iOS pre-release (invisible to Android APK updater)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_prerelease == true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          TAG="ios-unofficial-${SHORT_SHA}"
          NOTES_FILE="$(mktemp)"
          cat > "${NOTES_FILE}" <<EOF
          ## Derbis for iOS — Unofficial Native Build (\`${SHORT_SHA}\`)

          > **Unofficial iOS test package** — completely separate from the official Android APK line and ignored by Android update detection.

          ### Highlights
          - **100% Native iOS App (\`arm64\` Swift + SwiftUI + \`AVPlayer\`)** — zero HTML / WebView
          - **KSign Ready** — single \`Payload/Derbis.app\` bundle with no restricted Apple entitlements or extension plug-ins
          - **4 Derbis Skins:** Apple Music 13, Pixel UI (bundled \`Pixelify Sans\`), Derbis Default, and Late Night
          - **iOS Native Playback:** Background audio, Lock Screen & Dynamic Island controls, AirPlay picker, Sleep Timer, and Playback Speed
          - **Streaming & Library:** YouTube Music search/discovery/radio, time-synced \`LRCLIB\` lyrics, Offline M4A downloads, Local \`FLAC / ALAC / M4A / MP3 / WAV\` file import, and Navidrome / Subsonic server support

          ### Install with KSign
          1. Download **\`Derbis-unofficial.ipa\`** below on your iPhone.
          2. Open **KSign**, import \`Derbis-unofficial.ipa\`, sign with your certificate, and tap **Install**.
          EOF

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" build_output/Derbis-unofficial.ipa build_output/Derbis-unofficial.ipa.sha256 --clobber
          else
            gh release create "${TAG}" \
              build_output/Derbis-unofficial.ipa \
              build_output/Derbis-unofficial.ipa.sha256 \
              --title "Derbis iOS Unofficial (${SHORT_SHA})" \
              --notes-file "${NOTES_FILE}" \
              --prerelease \
              --latest=false \
              --target "${GITHUB_SHA}"
          fi
